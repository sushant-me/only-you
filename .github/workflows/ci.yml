name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ffmpeg tesseract-ocr imagemagick
      - name: tests
        run: make test
      - name: demo
        run: |
          make gen
          PYTHONPATH=src python3 -m onlyyou.cli demo > /dev/null
      - name: demo server smoke (the judge path)
        run: make smoke-web
      - name: self-audit
        run: python3 tools/audit.py
