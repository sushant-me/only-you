name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ffmpeg tesseract-ocr imagemagick
      - name: tests
        run: make test
      - name: demo
        run: |
          make gen
          PYTHONPATH=src python3 -m onlyyou.cli demo > /dev/null
      - name: demo server smoke (the judge path)
        run: make smoke-web
      - name: self-audit
        run: python3 tools/audit.py
      - name: static link check
        run: make links

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t only-you-demo .
      - name: run the container and probe it
        run: |
          docker run -d --rm --name only-you -p 8000:8000 only-you-demo
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/state > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/state | head -c 240
          echo
          curl -fsS -o /dev/null -w 'docs %{http_code}\n' http://127.0.0.1:8000/docs
          docker rm -f only-you
