name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: system deps (audit: PDFs, video durations, OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ffmpeg tesseract-ocr imagemagick
          tesseract --version | head -1

      - name: tests
        run: make test

      - name: generator + demo
        run: |
          make gen
          PYTHONPATH=src python3 -m onlyyou.cli demo > /dev/null

      - name: self-audit
        run: python3 tools/audit.py
